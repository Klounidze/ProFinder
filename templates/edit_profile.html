{% extends "base.html" %}

{% block title %}Редактировать профиль — ProFinder{% endblock %}

{% block content %}
<div class="edit-profile-container">
    <div class="edit-profile-card">
        <h2>✏️ Редактировать профиль</h2>
        <p class="subtitle">Измените свои данные</p>

        <form method="POST" action="{% url 'edit_profile' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Имя пользователя</label>
                <input type="text" id="id_username" name="username" value="{{ user.username }}" required>
            </div>
            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" id="id_email" name="email" value="{{ user.email }}" required>
            </div>
            <div class="form-group">
                <label for="id_phone">Телефон</label>
                <input type="text" id="id_phone" name="phone" value="{{ user.phone|default:'' }}">
            </div>
            <div class="form-group">
                <label for="id_avatar">Аватар</label>
                <input type="file" id="id_avatar" name="avatar" accept="image/*">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Сохранить</button>
                <a href="{% url 'profile' %}" class="btn btn-secondary">← Назад</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
