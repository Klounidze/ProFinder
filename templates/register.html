{% extends "base.html" %}

{% block title %}Регистрация — ProFinder{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Регистрация</h2>
        <p class="subtitle">Создайте аккаунт</p>

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" placeholder="Имя пользователя" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <label for="password1">Пароль</label>
                <input type="password" id="password1" name="password1" placeholder="Пароль (минимум 6 символов)" required>
            </div>
            <div class="form-group">
                <label for="password2">Подтверждение пароля</label>
                <input type="password" id="password2" name="password2" placeholder="Подтвердите пароль" required>
            </div>
            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="text" id="phone" name="phone" placeholder="Телефон (необязательно)">
            </div>
            <button type="submit" class="btn btn-success btn-block">Зарегистрироваться</button>
        </form>

        <p class="auth-link">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войдите</a>
        </p>
    </div>
</div>
{% endblock %}
